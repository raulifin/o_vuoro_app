services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    command: npm run dev -- --host 0.0.0.0

volumes:
  node_modules: